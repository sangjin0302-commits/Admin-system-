name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_DB_PROVIDER: sqlite
  DATABASE_URL: file:./prisma/dev.db
  AUTH_SECRET: ci-fake-secret-${{ github.sha }}
  NEXTAUTH_URL: http://localhost:3000
  # next build 는 러너 기본 힙(~2GB)을 넘겨 OOM(exit 134) 났음 — 힙 상향으로 고정.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:sqlite
      - run: npm run typecheck

  text-check:
    name: Text integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run text:check

  case-phase1:
    name: Case phase 1 scenario (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:push:sqlite
      - run: npm run test:case-phase1
        continue-on-error: true
      # 블로그 콘텐츠 정책 잠금 — 위반(네이버 외 임의 생성) 시 CI 실패로 차단.
      - run: npm run test:blog-source-guard
      # 텔레그램 알림 전송 계약 잠금 — 발송 로직 회귀 시 CI 실패로 차단.
      - run: npm run test:telegram
      # 보안 회귀 잠금 — 웹훅/이스케이프/export RBAC/수신거부 되돌아가면 CI 실패.
      - run: npm run test:security-guard

  # DB 불필요·결정적 잠금 테스트 — 하드 게이트(회귀 시 CI 실패로 실제 차단).
  locks:
    name: Lock tests (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:sqlite
      - run: npm run test:blog-source-guard
      - run: npm run test:telegram
      - run: npm run test:security-guard
      - run: npm run test:admin-rbac-guard
      - run: npm run test:ai-budget
      - run: npm run test:home-copy
      - run: npm run test:gazette
      - run: npm run test:gazette-service
      - run: npm run test:gazette-digest
      - run: npm run test:gazette-column
      - run: npm run test:landing-performance
      - run: npm run test:keyword-landing
      - run: npm run test:mask-email
      - run: npm run test:blog-portal-helpers
      - run: npm run test:site-settings-parity
      - run: npm run test:service-content-parse
      - run: npm run test:flag-cache
      - run: npm run test:vercel-cron
      - run: npm run test:anthropic-gateway
      - run: npm run test:static-en-routes
      - run: npm run test:toss-webhook
      # 공개 페이지 페이로드·색인 회귀 잠금(관보 캐시/렌더 상한·블로그 마크다운 캐시·sitemap).
      - run: npm run test:public-payload
      # 레거시 ?lang=en → /en 301 잠금(정적화한 페이지가 한국어로 새는 것 방지).
      - run: npm run test:i18n-legacy-lang

  # 코로케이션 유닛테스트(그동안 러너 없어 미실행) — 통과분 71개 하드게이트.
  # 실패 15개는 run-unit-tests.mjs EXCLUDE 에서 트리아지 대상으로 분리.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:sqlite
      - run: npm run db:push:sqlite
      - run: npm run test:unit

  env-check:
    name: Production env check (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ops:env:check
        continue-on-error: true

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # 안정화 완료 → push 게이트로 승격. 실패 시 CI 차단.
    #
    # timeout 60분: 30분일 때 잡이 항상 취소돼 게이트가 무의미했다(2026-08-08 확인).
    # 실측 내역 — 셋업(playwright install + db:push + next build)이 5분,
    # 남은 25분에 "85 tests using 1 worker" 를 다 못 돌리고 잘렸다.
    # 워커를 늘리는 쪽은 택하지 않았다: admin-features-toggle 이 기능 플래그를 토글하고
    # public-flag-surfaces 가 그 값을 읽는 등 스펙들이 sqlite·플래그 상태를 공유해서
    # 병렬로 돌리면 서로 간섭한다(workers:1 은 의도된 설정).
    timeout-minutes: 60
    # 절대경로 DB — db:push 와 next start(.next-local 런타임)가 상대경로를 서로
    # 다르게 해석해 "Unable to open the database file"(Error 14) 나던 것 고정.
    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db
      # admin-auth 미설정/약한비번 시 미들웨어가 503 fail-close → 스펙(401 기대)이 깨짐.
      # CI 전용 더미값(실서버 아님) + 강한비번 검사 off → 미인증 요청이 401 로 응답.
      ADMIN_BASIC_AUTH_USER: ci-admin
      ADMIN_BASIC_AUTH_PASSWORD: Ci-Admin-Pass-2026-strong
      ADMIN_ENFORCE_STRONG_CREDENTIALS: "false"
      # 스펙들이 미인증 admin API 를 다수 호출 → 기본 20회 제한에 걸려 429. 상향.
      ADMIN_AUTH_RATE_LIMIT_MAX_FAILURES: "200"
      # 배치 크론 라우트가 CRON_SECRET 없으면 500 → 스펙(401)이 깨짐. 더미 시크릿.
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 일부 스펙이 webkit 을 직접 launch 하므로 전체 브라우저 설치(chromium만 깔면
      # "Executable doesn't exist … webkit" 로 실패).
      - run: npx playwright install --with-deps
      - run: npm run prisma:generate:sqlite
      # prod 서버(next start)가 DB 를 읽으므로 스키마 반영 필요.
      - run: npm run db:push:sqlite
      - run: npm run build
      - run: npm run test:e2e
