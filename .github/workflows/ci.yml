name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_DB_PROVIDER: sqlite
  DATABASE_URL: file:./prisma/dev.db
  AUTH_SECRET: ci-fake-secret-${{ github.sha }}
  NEXTAUTH_URL: http://localhost:3000
  # next build 는 러너 기본 힙(~2GB)을 넘겨 OOM(exit 134) 났음 — 힙 상향으로 고정.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:sqlite
      - run: npm run typecheck

  text-check:
    name: Text integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run text:check

  case-phase1:
    name: Case phase 1 scenario (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:push:sqlite
      - run: npm run test:case-phase1
        continue-on-error: true
      # 블로그 콘텐츠 정책 잠금 — 위반(네이버 외 임의 생성) 시 CI 실패로 차단.
      - run: npm run test:blog-source-guard
      # 텔레그램 알림 전송 계약 잠금 — 발송 로직 회귀 시 CI 실패로 차단.
      - run: npm run test:telegram
      # 보안 회귀 잠금 — 웹훅/이스케이프/export RBAC/수신거부 되돌아가면 CI 실패.
      - run: npm run test:security-guard

  env-check:
    name: Production env check (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ops:env:check
        continue-on-error: true

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # e2e 는 아직 잠금(lock) 대상 아님 — 안정화 전까지 soft(실패해도 CI 차단 안 함).
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          DATABASE_URL: file:./prisma/dev.db
