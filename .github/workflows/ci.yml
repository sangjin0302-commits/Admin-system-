name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_DB_PROVIDER: sqlite
  DATABASE_URL: file:./prisma/dev.db
  AUTH_SECRET: ci-fake-secret-${{ github.sha }}
  NEXTAUTH_URL: http://localhost:3000

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate:sqlite
      - run: npm run typecheck

  text-check:
    name: Text integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run text:check

  case-phase1:
    name: Case phase 1 scenario (soft)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:push:sqlite
      - run: npm run test:case-phase1
        continue-on-error: true
      # 블로그 콘텐츠 정책 잠금 — 위반(네이버 외 임의 생성) 시 CI 실패로 차단.
      - run: npm run test:blog-source-guard
      # 텔레그램 알림 전송 계약 잠금 — 발송 로직 회귀 시 CI 실패로 차단.
      - run: npm run test:telegram

  env-check:
    name: Production env check (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ops:env:check
        continue-on-error: true

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          DATABASE_URL: file:./prisma/dev.db
