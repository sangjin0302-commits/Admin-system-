name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # next build 는 러너 기본 힙(~2GB)을 넘겨 OOM(exit 134) 났음 — 힙 상향으로 고정.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run verify
