<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오프라인 — ETHOS 행정사사무소</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Nanum Myeongjo", "Playfair Display", Georgia, serif; background: #F5F0E8; color: #1B2B6B; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { max-width: 28rem; background: white; border: 1px solid rgba(184, 151, 42, 0.3); border-radius: 24px; padding: 2.5rem; box-shadow: 0 18px 40px rgba(26, 60, 95, 0.1); }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.3em; color: #B8972A; text-transform: uppercase; }
    h1 { font-size: 1.75rem; margin: 0.75rem 0 1rem; }
    p { color: #4a5568; line-height: 1.7; font-size: 0.95rem; margin: 0 0 0.75rem; }
    .channels { display: grid; gap: 0.5rem; margin-top: 1.5rem; }
    .channel { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 0.875rem; }
    .naver { background: #03C75A; color: white; }
    .kakao { background: #FEE500; color: #3C1E1E; }
    .telegram { background: #0088CC; color: white; }
    .email { background: #1B2B6B; color: white; }
    .retry { display: block; width: 100%; margin-top: 1.5rem; padding: 0.85rem; background: transparent; border: 1px solid rgba(184, 151, 42, 0.4); border-radius: 12px; font-size: 0.85rem; font-weight: 700; color: #1B2B6B; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <p class="kicker">Offline</p>
      <h1>지금 오프라인 상태입니다</h1>
      <p>인터넷 연결이 끊겼습니다. 검토 요청은 아래 채널 중 어디로든 직접 보내주시면, 연결되는 즉시 회신드립니다.</p>
      <div class="channels">
        <a class="channel naver" href="http://talk.naver.com/WP044ZF">네이버 톡톡 →</a>
        <a class="channel kakao" href="http://pf.kakao.com/_xnQLnX">카카오 채팅 →</a>
        <a class="channel telegram" href="https://t.me/EthosAdmin">텔레그램 @EthosAdmin →</a>
        <a class="channel email" href="mailto:a.attorneyjean@gmail.com">a.attorneyjean@gmail.com →</a>
      </div>
      <button class="retry" onclick="location.reload()">다시 시도</button>
    </div>
  </div>
</body>
</html>
